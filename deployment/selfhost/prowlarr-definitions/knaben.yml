---
# Custom Cardigann definition — Knaben (knaben.org) via its JSON API.
#
# Knaben is a public torrent META-AGGREGATOR: one search hits many trackers at once. Its v1 API
# returns the infohash + magnet directly, so Comet never has to download a .torrent through
# FlareSolverr/Byparr — magnet-first, no Cloudflare, no per-result bottleneck.
#
# Install: drop this file in Prowlarr's  /config/Definitions/Custom/  then restart Prowlarr and
# add "Knaben" under Add Indexer. See SELF-HOST notes for the docker one-liner.
#
# NOTE: this is a hand-written JSON definition — if a Test returns 0 results, the two usual fixes
# are the rows selector (hits vs hits.hits) and the date format. Paste the Prowlarr/Comet output
# and the selectors get tuned from there.
id: knaben
name: Knaben
description: "Knaben — public torrent meta-search aggregator (JSON API, magnet-first, no Cloudflare)."
language: en-US
type: public
encoding: UTF-8
followredirect: false
testlinktorrent: false
requestDelay: 2
links:
  - https://api.knaben.org/

caps:
  categorymappings:
    - {id: "1000000", cat: Audio, desc: "Audio"}
    - {id: "2000000", cat: Movies, desc: "Films"}
    - {id: "3000000", cat: TV, desc: "TV"}
    - {id: "4000000", cat: PC, desc: "Apps"}
    - {id: "5000000", cat: PC/Games, desc: "Games"}
    - {id: "6000000", cat: Books, desc: "Books"}
    - {id: "8000000", cat: XXX, desc: "XXX"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: info
    type: info
    label: About
    default: "Aggregates many public trackers and returns magnets/infohashes directly — no Cloudflare and no .torrent download step."

search:
  paths:
    - path: "v1"
      method: post
      # Content-Type MUST be inside the path block — at search level Cardigann ignores it and POSTs
      # form-encoded, which Knaben rejects with HTTP 415 Unsupported Media Type.
      headers:
        Content-Type:
          - "application/json"
      response:
        type: json
  inputs:
    # Raw JSON request body. {{ .Keywords }} is filled by Prowlarr with the (season/episode-aware)
    # search string. order by seeders so the best-seeded releases come first.
    $raw: |-
      {
        "search_type": "score",
        "search_field": "title",
        "query": "{{ .Keywords }}",
        "order_by": "seeders",
        "order_direction": "desc",
        "from": 0,
        "size": 300,
        "hide_unsafe": true,
        "hide_xxx": false
      }
  rows:
    # Top-level array of result objects. If 0 results but the site clearly has them, try: hits.hits
    selector: hits
  fields:
    title:
      selector: title
    infohash:
      selector: hash
    magneturl:
      selector: magnetUrl
    seeders:
      selector: seeders
    leechers:
      selector: peers
    size:
      selector: bytes
    date:
      selector: date
      optional: true
    details:
      selector: details
      optional: true
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
