# nginx load balancer in front of the Byparr solver pool.
# Prowlarr's FlareSolverr proxy points at http://flaresolverr:8191 (this nginx); each request is
# routed to the least-busy worker so multiple Cloudflare solves run in parallel.

upstream byparr_pool {
    least_conn;
    server byparr1:8191 max_fails=2 fail_timeout=30s;
    server byparr2:8191 max_fails=2 fail_timeout=30s;
    server byparr3:8191 max_fails=2 fail_timeout=30s;
    # Add more workers here if you scale the pool up (and add matching services in docker-compose.yml).
}

server {
    listen 8191;

    location / {
        proxy_pass http://byparr_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A Cloudflare solve can take 10-40s — don't let nginx cut it off (defaults are 60s).
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # If a worker is mid-solve / unreachable, try the next one.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
