# Self-hosted Comet stack (patched fork) — name-search torrent addon for Stremio/Nuvio.
#
#   Comet  → Prowlarr → indexers (1337x etc. via FlareSolverr for Cloudflare)
#          → Postgres (its DB)
#
# Comet is BUILT FROM THIS REPO (../..) so our TheTVDB "#DUPE#" metadata patch is baked in
# (comet/metadata/tvdb_dupe.py + manager.py). Debrid keys (AllDebrid / TorBox) are entered per-user
# in Comet's config page — NOT here.
#
# Bring up:  docker compose -f deployment/selfhost/docker-compose.yml --env-file deployment/selfhost/.env up -d --build
# See SELF-HOST.md for the one-time Prowlarr setup.

services:
  comet:
    container_name: comet
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"          # Nuvio installs from http://<vps>:8000/<config>/manifest.json
    env_file:
      - .env
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: comet:comet@postgres:5432/comet
      # Use Prowlarr as the indexer manager (set the API key in .env after first Prowlarr boot).
      INDEXER_MANAGER_TYPE: prowlarr
      INDEXER_MANAGER_URL: http://prowlarr:9696
      INDEXER_MANAGER_API_KEY: ${PROWLARR_API_KEY}
      # Per-Prowlarr-search timeout. With several indexers and TWO Cloudflare-gated ones, Byparr
      # (one browser) solves challenges serially, so a cold sweep needs well over 60s. 120s gives it
      # room. Because ALWAYS_RESCRAPE_BACKGROUND below runs the scrape behind the request, this long
      # timeout does NOT slow down opening a title (only the very first, empty-cache open waits).
      INDEXER_MANAGER_TIMEOUT: ${INDEXER_MANAGER_TIMEOUT:-120}
      INDEXER_MANAGER_WAIT_TIMEOUT: ${INDEXER_MANAGER_WAIT_TIMEOUT:-120}
      # Time to fetch EACH torrent/magnet from Prowlarr's /download proxy. The 5s default drops most
      # results, because for indexers without a direct magnet (1337x etc.) Prowlarr has to fetch the
      # torrent page itself — through FlareSolverr for Cloudflare ones — which takes far longer than
      # 5s. Background scraping means this never delays opening a title.
      GET_TORRENT_TIMEOUT: ${GET_TORRENT_TIMEOUT:-65}
      # Don't fetch all torrent files at once. Cloudflare indexers resolve each .torrent through
      # Byparr's single browser, so a parallel flood makes them share one timeout and nearly all fail.
      # Capping concurrency lets each batch use its full GET_TORRENT_TIMEOUT — far more survive.
      # Lower it (4-6) if you lean on Cloudflare indexers; raise it if yours return magnets directly.
      GET_TORRENT_CONCURRENCY: ${GET_TORRENT_CONCURRENCY:-8}
      # If a Cloudflare indexer 429s with a long Retry-After (e.g. 60s), give up on that request
      # instead of blocking the scrape for minutes (which makes the client time out). 0 = honor fully.
      RATELIMIT_RETRY_MAX_DELAY: ${RATELIMIT_RETRY_MAX_DELAY:-10}
      # Re-scrape every request (Prowlarr + all scrapers) and merge new torrents onto the cache.
      ALWAYS_RESCRAPE: ${ALWAYS_RESCRAPE:-True}
      # Do that rescrape in the BACKGROUND: return cached results instantly, refresh behind the
      # request so slow Cloudflare indexers never make you wait. New results appear on the next open.
      ALWAYS_RESCRAPE_BACKGROUND: ${ALWAYS_RESCRAPE_BACKGROUND:-True}
    volumes:
      - comet_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      prowlarr:
        condition: service_started

  postgres:
    container_name: comet-postgres
    # Pinned to 17: PG18 images moved to a versioned, pg_ctlcluster-style data layout that fights a
    # plain volume mount. 17 uses the classic PGDATA at /var/lib/postgresql/data — no drama.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comet
      POSTGRES_PASSWORD: comet
      POSTGRES_DB: comet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet -d comet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s   # give first-boot initdb time before counting failures

  prowlarr:
    container_name: comet-prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "9696:9696"          # Prowlarr UI — add indexers + the FlareSolverr proxy here
    volumes:
      - prowlarr_config:/config

  # ── Cloudflare solver (single Byparr) ────────────────────────────────────────
  # ONE Byparr browser is enough now that the indexers (1337x etc.) are set to return MAGNETS — Byparr
  # only solves the search page (one solve per query, then Prowlarr reuses the cf_clearance cookie for
  # direct requests). The old 3-worker pool existed to parallelize bulk .torrent DOWNLOAD solves;
  # magnet results have no download step, so the pool was just RAM overhead (3 Chromium ≈ 3-6 GB) and
  # was starving the box, making solves time out. Runs directly on the VPS IP (no VPN). Prowlarr's
  # proxy still points at http://flaresolverr:8191. (Pool version is in git history if ever needed.)
  flaresolverr:
    container_name: comet-flaresolverr
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "8191:8191"
    environment:
      PORT: "8191"
      TZ: ${TZ:-Etc/UTC}

volumes:
  comet_data:
  postgres_data:
  prowlarr_config:
