# Self-hosted Comet stack (patched fork) — name-search torrent addon for Stremio/Nuvio.
#
#   Comet  → Prowlarr → indexers (1337x etc. via FlareSolverr for Cloudflare)
#          → Postgres (its DB)
#
# Comet is BUILT FROM THIS REPO (../..) so our TheTVDB "#DUPE#" metadata patch is baked in
# (comet/metadata/tvdb_dupe.py + manager.py). Debrid keys (AllDebrid / TorBox) are entered per-user
# in Comet's config page — NOT here.
#
# Bring up:  docker compose -f deployment/selfhost/docker-compose.yml --env-file deployment/selfhost/.env up -d --build
# See SELF-HOST.md for the one-time Prowlarr setup.

services:
  comet:
    container_name: comet
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"          # Nuvio installs from http://<vps>:8000/<config>/manifest.json
    env_file:
      - .env
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: comet:comet@postgres:5432/comet
      # Use Prowlarr as the indexer manager (set the API key in .env after first Prowlarr boot).
      INDEXER_MANAGER_TYPE: prowlarr
      INDEXER_MANAGER_URL: http://prowlarr:9696
      INDEXER_MANAGER_API_KEY: ${PROWLARR_API_KEY}
    volumes:
      - comet_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      prowlarr:
        condition: service_started

  postgres:
    container_name: comet-postgres
    # Pinned to 17: PG18 images moved to a versioned, pg_ctlcluster-style data layout that fights a
    # plain volume mount. 17 uses the classic PGDATA at /var/lib/postgresql/data — no drama.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comet
      POSTGRES_PASSWORD: comet
      POSTGRES_DB: comet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet -d comet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s   # give first-boot initdb time before counting failures

  prowlarr:
    container_name: comet-prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "9696:9696"          # Prowlarr UI — add indexers + the FlareSolverr proxy here
    volumes:
      - prowlarr_config:/config

  # Dedicated VPN sidecar for FlareSolverr (self-contained — does not touch the DaddyLive stack).
  # FlareSolverr joins this container's network namespace, so ALL its traffic exits the VPN instead of
  # the VPS's datacenter IP — the attempt to get past Cloudflare on 1337x. Uses your NordVPN *service*
  # credentials (same kind as DaddyLive). NordVPN allows up to 10 connections, so this 2nd tunnel is fine.
  # ⚠ NordVPN exits are themselves datacenter IPs, which Cloudflare often still blocks — this may not
  #   beat 1337x. The only reliable bypass is a residential/mobile IP. It still helps other CF indexers.
  gluetun:
    container_name: comet-gluetun
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: openvpn
      OPENVPN_USER: ${NORDVPN_USER}
      OPENVPN_PASSWORD: ${NORDVPN_PASSWORD}
      SERVER_COUNTRIES: ${VPN_COUNTRY:-United States}
      SERVER_CITIES: ${VPN_CITIES:-}                # optional: pin to less-burned cities (e.g. "Buffalo,Phoenix"); blank = any in country
      BLOCK_MALICIOUS: "off"                        # default-on DNS filter blackholes domains (DaddyLive lesson)
      FIREWALL_INPUT_PORTS: "8191"                  # allow Prowlarr to reach FlareSolverr through gluetun
      FIREWALL_OUTBOUND_SUBNETS: "172.28.0.0/16"    # must match the compose network subnet below (LAN replies)
      TZ: ${TZ:-Etc/UTC}
    restart: unless-stopped

  # Solver. Byparr is a FlareSolverr-API-compatible drop-in that drives a REAL anti-detect browser
  # (nodriver/SeleniumBase) instead of plain headless Chrome — much better against modern Cloudflare.
  # Still listens on :8191, so Prowlarr's "FlareSolverr" proxy (http://gluetun:8191) needs no change.
  # Heavier than FlareSolverr (real Chromium) — shm_size avoids browser crashes.
  flaresolverr:
    container_name: comet-flaresolverr
    image: ghcr.io/thephaseless/byparr:latest
    network_mode: "service:gluetun"   # share gluetun's netns → egress via VPN; Prowlarr reaches it at http://gluetun:8191
    shm_size: "2gb"
    environment:
      PORT: "8191"
      TZ: ${TZ:-Etc/UTC}
    depends_on:
      - gluetun
    restart: unless-stopped

volumes:
  comet_data:
  postgres_data:
  prowlarr_config:

# Fixed subnet so gluetun's FIREWALL_OUTBOUND_SUBNETS can whitelist the LAN deterministically.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
